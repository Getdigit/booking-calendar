name: Refresh bookings

on:
  schedule:
    - cron: '0 * * * *'  # elk uur
  workflow_dispatch:

permissions:
  contents: write

env:
  DATAVERSE_URL: https://getdigit.crm4.dynamics.com
  ENTITY_SET: gd_bookings
  START_FIELD: gd_startdate
  END_FIELD: gd_enddate

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Dataverse token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ secrets.POWERPLATFORM_TENANT_ID }}/oauth2/v2.0/token" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${{ secrets.POWERPLATFORM_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.POWERPLATFORM_CLIENT_SECRET }}" \
            --data-urlencode "scope=${DATAVERSE_URL}/.default")

          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Auth failed: $(echo "$RESPONSE" | jq -r '.error_description')"
            exit 1
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Fetch bookings from Dataverse
        run: |
          HTTP_CODE=$(curl -s -o /tmp/bookings_raw.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "OData-MaxVersion: 4.0" -H "OData-Version: 4.0" \
            -H "Accept: application/json" \
            "${DATAVERSE_URL}/api/data/v9.2/${ENTITY_SET}?\$select=${START_FIELD},${END_FIELD}&\$filter=statecode%20eq%200&\$orderby=${START_FIELD}%20asc")

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Dataverse error response:"
            cat /tmp/bookings_raw.json
            exit 1
          fi

          # Strip everything except start/end dates — no IDs, ETags, or tenant URLs
          jq '{value: [.value[] | {gd_startdate, gd_enddate}]}' /tmp/bookings_raw.json \
            > public/bookings.json

          echo "Bookings fetched:"
          jq '.value | length' public/bookings.json

      - name: Commit if changed
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/bookings.json
          git diff --staged --quiet || git commit -m "chore: refresh bookings"
          git push
